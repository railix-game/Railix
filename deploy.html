const log=t=>{document.getElementById('log').textContent+="\n"+t};let acct;
const eth=window.ethereum;
document.getElementById('c').onclick=async()=>{
 if(!eth){log('No wallet found. Open railix.xyz/deploy.html in your wallet app browser.');return}
 try{acct=(await eth.request({method:'eth_requestAccounts'}))[0];log('Connected: '+acct);
 try{await eth.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x38'}]})}catch(e){if(e.code===4902){await eth.request({method:'wallet_addEthereumChain',params:[{chainId:'0x38',chainName:'BNB Smart Chain',nativeCurrency:{name:'BNB',symbol:'BNB',decimals:18},rpcUrls:['https://bsc-dataseed.binance.org'],blockExplorerUrls:['https://bscscan.com']}]})}else throw e}
 const cid=await eth.request({method:'eth_chainId'});log('Chain: '+parseInt(cid,16));
 if(cid!=='0x38'){log('Please switch to BNB Smart Chain.');return}
 const bal=await eth.request({method:'eth_getBalance',params:[acct,'latest']});log('Balance: '+(Number(BigInt(bal))/1e18).toFixed(5)+' BNB');
 document.getElementById('d').disabled=false}catch(e){log('Error: '+(e.message||e))}};
document.getElementById('d').onclick=async()=>{
 const b=document.getElementById('d');b.disabled=true;
 try{log('Confirm the deployment in your wallet…');
 const tx=await eth.request({method:'eth_sendTransaction',params:[{from:acct,data:BYTECODE}]});
 log('Sent: '+tx+'\nWaiting for confirmation…');
 let r=null;while(!r){await new Promise(s=>setTimeout(s,3000));r=await eth.request({method:'eth_getTransactionReceipt',params:[tx]})}
 if(r.status==='0x1'){log('\nDEPLOYED ✓\nContract: '+r.contractAddress+'\nSend this address to Hark.');const a=document.createElement('a');a.href='https://bscscan.com/address/'+r.contractAddress;a.textContent='View on BscScan';a.target='_blank';document.getElementById('log').after(a)}
 else{log('Transaction failed.');b.disabled=false}}catch(e){log('Error: '+(e.message||e));b.disabled=false}};
